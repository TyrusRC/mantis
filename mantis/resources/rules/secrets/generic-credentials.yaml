rules:
  - id: secret-generic-password-assignment
    languages: [generic]
    severity: WARNING
    message: |
      Variable named `password` / `passwd` / `pwd` assigned to a non-empty
      literal in source. Move secrets to environment or a secret manager.
      Common false positive on documentation and fixtures — review context.
    patterns:
      - pattern-regex: '(?i)(?<![A-Za-z0-9_])(password|passwd|pwd|secret)\s*[:=]\s*["''][^"''\n]{6,}["'']'
      - pattern-not-regex: '(?i)(password|passwd|pwd|secret)\s*[:=]\s*["''](password|secret|change[_-]?me|placeholder|xxx+|todo|tbd|example|your[_-]?password|insertpassword|hunter2|p@ssw0rd|<.*>|\$\{[^}]+\}|\{\{[^}]+\}\}|os\.environ|process\.env|getenv|null|none|undefined|n/a|na|test|demo|sample|admin)["'']'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/*.min.js"
        - "**/test/**"
        - "**/tests/**"
        - "**/fixtures/**"
        - "**/testdata/**"
        - "**/.git/**"
        - "**/docs/**"
        - "**/*.md"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: LOW
      pack: [secrets, deep]

  - id: secret-generic-api-key-assignment
    languages: [generic]
    severity: WARNING
    message: |
      Variable named `api_key` / `apikey` / `token` assigned to a literal
      with high-entropy alphanumeric value. Validate the value isn't a
      template and move to runtime config.
    patterns:
      - pattern-regex: '(?i)(?<![A-Za-z0-9_])(api[_-]?key|apikey|access[_-]?token|auth[_-]?token|bearer[_-]?token)\s*[:=]\s*["''][A-Za-z0-9_\-]{20,}["'']'
      - pattern-not-regex: '(?i)["''](your[_-]?api[_-]?key|placeholder|xxx+|<.*>|\$\{|\{\{|os\.environ|process\.env|getenv|example|sample|test|todo|tbd|insertkey)'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/test/**"
        - "**/tests/**"
        - "**/fixtures/**"
        - "**/.git/**"
        - "**/docs/**"
        - "**/*.md"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: LOW
      pack: [secrets, deep]

  - id: secret-db-connection-string-with-password
    languages: [generic]
    severity: ERROR
    message: |
      Database connection string with embedded password in source. Split the
      password out and inject via env at runtime; rotate the credential.
    patterns:
      - pattern-regex: '(?i)(postgres|postgresql|mysql|mariadb|mongodb|redis|amqp)://[A-Za-z0-9_-]+:[^@\s"''<>${}/]{4,}@[A-Za-z0-9._-]+'
      - pattern-not-regex: '(?i)://[A-Za-z0-9_-]+:(\$\{[^}]+\}|\{\{[^}]+\}\}|password|secret|change[_-]?me|placeholder|xxx+|todo)@'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/test/**"
        - "**/tests/**"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: MEDIUM
      pack: [secrets, fast, deep, bugbounty]
