rules:
  - id: secret-aws-access-key-id
    languages: [generic]
    severity: ERROR
    message: |
      AWS Access Key ID literal in source. Move to env var, secret manager,
      or instance role. Rotate the key — it must be considered compromised
      the moment it landed in version control.
    patterns:
      - pattern-regex: '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/dist/**"
        - "**/build/**"
        - "**/target/**"
        - "**/.git/**"
        - "**/*.lock"
        - "**/*.lockb"
        - "**/*.min.js"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: HIGH
      owasp: "A07:2025 Identification and Authentication Failures"
      pack: [secrets, fast, deep, bugbounty]

  - id: secret-aws-secret-access-key
    languages: [generic]
    severity: ERROR
    message: |
      Probable AWS Secret Access Key (40-char base64 next to an AWS context).
      Rotate immediately and remove from history; storing in source is
      indistinguishable from publishing it.
    patterns:
      - pattern-either:
          - pattern-regex: '(?i)aws_secret_access_key\s*[:=]\s*["'']?([A-Za-z0-9/+=]{40})["'']?'
          - pattern-regex: '(?i)secret[_-]?key\s*[:=]\s*["'']?([A-Za-z0-9/+=]{40})["'']?'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/dist/**"
        - "**/build/**"
        - "**/*.min.js"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: MEDIUM
      owasp: "A07:2025 Identification and Authentication Failures"
      pack: [secrets, deep]

  - id: secret-gcp-service-account-key
    languages: [generic]
    severity: ERROR
    message: |
      GCP service-account private key material in source. Use Workload
      Identity / Application Default Credentials / Secret Manager instead.
    patterns:
      - pattern-regex: '"type"\s*:\s*"service_account"'
    paths:
      include:
        - "*.json"
        - "**/*.json"
      exclude:
        - "**/node_modules/**"
        - "**/package*.json"
        - "**/tsconfig*.json"
        - "**/composer.json"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: MEDIUM
      owasp: "A07:2025 Identification and Authentication Failures"
      pack: [secrets, deep]

  - id: secret-azure-storage-key
    languages: [generic]
    severity: ERROR
    message: |
      Azure Storage account key in source. Switch to Managed Identity or
      SAS tokens with limited scope and TTL.
    patterns:
      - pattern-regex: '(?i)(AccountKey|account[-_]?key)\s*[:=]\s*["'']?[A-Za-z0-9+/]{86,88}={0,2}'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: MEDIUM
      pack: [secrets, deep]
