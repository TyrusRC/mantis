rules:
  - id: secret-github-personal-access-token
    languages: [generic]
    severity: ERROR
    message: |
      GitHub Personal Access Token literal. Revoke at github.com/settings/tokens,
      rotate, and load from env or a secret manager.
    patterns:
      - pattern-regex: '\bghp_[A-Za-z0-9]{36}\b'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: HIGH
      pack: [secrets, fast, deep, bugbounty]

  - id: secret-github-fine-grained-pat
    languages: [generic]
    severity: ERROR
    message: |
      GitHub fine-grained Personal Access Token literal. Revoke and rotate.
    patterns:
      - pattern-regex: '\bgithub_pat_[A-Za-z0-9_]{82}\b'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: HIGH
      pack: [secrets, fast, deep, bugbounty]

  - id: secret-github-oauth-token
    languages: [generic]
    severity: ERROR
    message: |
      GitHub OAuth access token literal. Revoke and rotate.
    patterns:
      - pattern-regex: '\bgho_[A-Za-z0-9]{36}\b'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: HIGH
      pack: [secrets, fast, deep]

  - id: secret-slack-bot-token
    languages: [generic]
    severity: ERROR
    message: |
      Slack bot/user token literal. Rotate in api.slack.com/apps.
    patterns:
      - pattern-regex: '\bxox[baprs]-[0-9A-Za-z-]{10,72}\b'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: HIGH
      pack: [secrets, fast, deep]

  - id: secret-stripe-live-key
    languages: [generic]
    severity: ERROR
    message: |
      Live Stripe API key. Rotate immediately in dashboard.stripe.com/apikeys
      and audit usage. Test keys (sk_test_) are not flagged here.
    patterns:
      - pattern-regex: '\bsk_live_[0-9a-zA-Z]{24,}\b'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: HIGH
      pack: [secrets, fast, deep, bugbounty]

  - id: secret-anthropic-api-key
    languages: [generic]
    severity: ERROR
    message: |
      Anthropic API key literal. Rotate in console.anthropic.com.
    patterns:
      - pattern-regex: '\bsk-ant-api03-[A-Za-z0-9_-]{93}AA\b'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: HIGH
      pack: [secrets, fast, deep]

  - id: secret-openai-api-key
    languages: [generic]
    severity: ERROR
    message: |
      OpenAI API key literal. Rotate at platform.openai.com/api-keys.
    patterns:
      - pattern-regex: '\bsk-(proj-)?[A-Za-z0-9_-]{32,}T3BlbkFJ[A-Za-z0-9_-]{20,}\b'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: HIGH
      pack: [secrets, fast, deep]

  - id: secret-google-api-key
    languages: [generic]
    severity: WARNING
    message: |
      Google API key literal. If unrestricted, anyone with the key can rack
      up quota; restrict by referrer / IP / API and rotate.
    patterns:
      - pattern-regex: '\bAIza[0-9A-Za-z_-]{35}\b'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: MEDIUM
      pack: [secrets, deep]

  - id: secret-private-key-pem
    languages: [generic]
    severity: ERROR
    message: |
      PEM-encoded private key in source. Revoke the certificate / SSH key and
      load private keys from a secret store at runtime.
    patterns:
      - pattern-regex: '-----BEGIN ((RSA|DSA|EC|OPENSSH|PGP) )?PRIVATE KEY-----'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/.git/**"
        - "**/test/fixtures/**"
        - "**/tests/fixtures/**"
        - "**/testdata/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: HIGH
      pack: [secrets, fast, deep, bugbounty]

  - id: secret-jwt-with-signature
    languages: [generic]
    severity: WARNING
    message: |
      Likely JWT literal in source — if this is a real production token,
      anything inside (claims, signing secret leak via brute force) is
      exposed. Move to runtime config.
    patterns:
      - pattern-regex: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/*.min.js"
        - "**/test/**"
        - "**/tests/**"
        - "**/.git/**"
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: MEDIUM
      pack: [secrets, deep]
