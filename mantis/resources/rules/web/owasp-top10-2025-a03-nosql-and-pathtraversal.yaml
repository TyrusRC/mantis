rules:
  - id: web-a03-nosql-injection-mongoose
    languages: [javascript, typescript]
    severity: ERROR
    message: |
      Mongoose / MongoDB query built from request body without
      sanitization. NoSQL operator injection (`{$ne: null}`,
      `{$gt: ""}`) gives auth bypass. Cast to string or whitelist
      operators via `express-mongo-sanitize`.

      OWASP Top 10:2025 — A03 Injection
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.body
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.headers
          - pattern: $REQ.cookies
          - pattern: $REQ.body.$F
          - pattern: $REQ.query.$F
          - pattern: $REQ.params.$F
          - pattern: $REQ.headers.$F
          - pattern: $REQ.cookies.$F
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $MODEL.findOne($Q, ...)
              - pattern: $MODEL.find($Q, ...)
              - pattern: $MODEL.findOneAndUpdate($Q, ...)
              - pattern: $MODEL.updateOne($Q, ...)
              - pattern: $MODEL.deleteOne($Q, ...)
              - pattern: $MODEL.countDocuments($Q, ...)
          # Array.prototype.find(callback) is not a query.
          - pattern-not: $MODEL.find(($...A) => $B, ...)
          - pattern-not: $MODEL.find(function ($...A) { ... }, ...)
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern-either:
          - pattern: String($X)
          - pattern: Number($X)
          - pattern: $X.toString()
          - pattern: mongoSanitize.sanitize($X, ...)
          - pattern: sanitize($X)
    metadata:
      category: security
      owasp: "A05:2025 Injection"
      cwe: "CWE-943"
      confidence: HIGH
      pack: [web, fast, deep, bugbounty]

  - id: web-a03-path-traversal-fs-node
    languages: [javascript, typescript]
    severity: ERROR
    message: |
      `fs.readFile` / `fs.createReadStream` / `res.sendFile` called
      with a path concatenated from user input. Normalise + verify
      the resolved path is inside an allow-list root.

      OWASP Top 10:2025 — A03 Injection (Path Traversal)
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.body
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.headers
          - pattern: $REQ.cookies
          - pattern: $REQ.body.$F
          - pattern: $REQ.query.$F
          - pattern: $REQ.params.$F
          - pattern: $REQ.headers.$F
          - pattern: $REQ.cookies.$F
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fs.readFile($P, ...)
              - pattern: fs.readFileSync($P, ...)
              - pattern: fs.promises.readFile($P, ...)
              - pattern: fs.createReadStream($P, ...)
              - pattern: $RES.sendFile($P, ...)
              - pattern: $RES.download($P, ...)
          # Express rejects paths escaping an explicit `root`.
          - pattern-not: '$RES.sendFile($P, { ..., root: $ROOT, ... }, ...)'
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: path.basename(...)
    metadata:
      category: security
      owasp: "A05:2025 Injection"
      cwe: "CWE-22"
      confidence: HIGH
      pack: [web, fast, deep, bugbounty]

  - id: web-a03-path-traversal-python
    languages: [python]
    severity: ERROR
    message: |
      `open()` / `send_file` / `send_from_directory` with a path
      derived from request data. Resolve + verify the path is inside
      an allow-list root before opening.

      OWASP Top 10:2025 — A03 Injection (Path Traversal)
    patterns:
      - pattern-either:
          - pattern: open(request.args.get(...), ...)
          - pattern: open(request.args[...], ...)
          - pattern: open(request.form.get(...), ...)
          - pattern: open(request.form[...], ...)
          - pattern: send_file(request.args.get(...), ...)
          - pattern: send_file(request.args[...], ...)
          - pattern: send_file(request.form.get(...), ...)
          - pattern: send_from_directory($DIR, request.args.get(...), ...)
          - pattern: send_from_directory($DIR, request.args[...], ...)
    metadata:
      category: security
      owasp: "A05:2025 Injection"
      cwe: "CWE-22"
      confidence: HIGH
      pack: [web, fast, deep, bugbounty]

  - id: web-a08-prototype-pollution-node
    languages: [javascript, typescript]
    severity: ERROR
    message: |
      Recursive merge or path-set on user data — `Object.assign`,
      `_.merge`, `_.mergeWith`, `_.set`, `_.setWith` with
      attacker-controlled keys can write to `Object.prototype`.
      Use object spread, structured cloning, or Map.

      OWASP Top 10:2025 — A08 Software and Data Integrity Failures
    patterns:
      - pattern-either:
          - pattern: _.merge($DST, req.body)
          - pattern: _.merge($DST, req.query)
          - pattern: _.mergeWith($DST, req.body, ...)
          - pattern: _.set($DST, req.body.$F, ...)
          - pattern: _.setWith($DST, req.body.$F, ...)
          - pattern: lodash.merge($DST, req.body)
          - pattern: Object.assign({}, $DST, req.body)
          - pattern: extend(true, $DST, req.body)
    metadata:
      category: security
      owasp: "A08:2025 Software or Data Integrity Failures"
      cwe: "CWE-1321"
      confidence: HIGH
      pack: [web, fast, deep, bugbounty]
