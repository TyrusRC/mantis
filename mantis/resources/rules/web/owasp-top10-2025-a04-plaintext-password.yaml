rules:
  - id: web-a04-password-no-hash-python
    languages: [python]
    severity: ERROR
    message: |
      Password from user input stored or compared without hashing. Use
      bcrypt, argon2, or scrypt. Never store or compare plaintext
      passwords.

      OWASP Top 10:2025 -- A04 Insecure Design
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  $PWD = request.$METHOD.get("password")
                  ...
                  $QUERY = f"...{$PWD}..."
          - patterns:
              - pattern: |
                  $PWD = $AUTH.get("password")
                  ...
                  $QUERY = f"...{$PWD}..."
          - patterns:
              - pattern: |
                  $PWD = request.$METHOD["password"]
                  ...
                  $QUERY = f"...{$PWD}..."
    metadata:
      category: security
      owasp: "A04:2025 Insecure Design"
      cwe: "CWE-256"
      confidence: HIGH
      pack: [web, fast, deep, bugbounty]

  - id: web-a04-sql-password-plaintext-compare
    languages: [python]
    severity: ERROR
    message: |
      SQL query compares password in plaintext (WHERE ... password='...').
      Fetch the hash and compare with bcrypt.checkpw() or equivalent.

      OWASP Top 10:2025 -- A04 Insecure Design
    pattern: |
      $QUERY = f"...password='{$PWD}'..."
    metadata:
      category: security
      owasp: "A04:2025 Insecure Design"
      cwe: "CWE-256"
      confidence: HIGH
      pack: [web, fast, deep, bugbounty]
