# One rule per language: a rule's patterns must parse in every language it
# lists, so a mixed-syntax pattern-either is a parse error for all of them.
rules:
- id: web-a07-weak-password-hash-python
  languages:
  - python
  severity: ERROR
  message: |
    MD5/SHA1 used to hash a password. Fast digests are trivially cracked on
    GPUs. Use bcrypt, scrypt, or Argon2id.

    OWASP Top 10:2025 — A07 Identification and Authentication Failures
  patterns:
  - pattern-either:
    - pattern: hashlib.md5($PASSWORD, ...)
    - pattern: hashlib.sha1($PASSWORD, ...)
    - pattern: hashlib.new("md5", $PASSWORD, ...)
    - pattern: hashlib.new("sha1", $PASSWORD, ...)
  - metavariable-regex:
      metavariable: $PASSWORD
      regex: (?i).*(passw|pwd|passphrase).*
  metadata:
    category: security
    owasp: A07:2025 Identification and Authentication Failures
    cwe: CWE-916
    confidence: HIGH
    pack:
    - web
    - fast
    - deep
    - bugbounty
- id: web-a07-weak-password-hash-javascript
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: |
    MD5/SHA1 used to hash a password. Fast digests are trivially cracked on
    GPUs. Use bcrypt, scrypt, or Argon2id.

    OWASP Top 10:2025 — A07 Identification and Authentication Failures
  patterns:
  - pattern: $CRYPTO.createHash($ALG).update($PASSWORD, ...)
  - metavariable-regex:
      metavariable: $ALG
      regex: (?i)^['"](md5|sha1)['"]$
  - metavariable-regex:
      metavariable: $PASSWORD
      regex: (?i).*(passw|pwd|passphrase).*
  metadata:
    category: security
    owasp: A07:2025 Identification and Authentication Failures
    cwe: CWE-916
    confidence: HIGH
    pack:
    - web
    - fast
    - deep
    - bugbounty
- id: web-a07-weak-password-hash-java
  languages:
  - java
  severity: ERROR
  message: |
    MD5/SHA1 MessageDigest used to hash a password. Fast digests are trivially
    cracked on GPUs. Use bcrypt, scrypt, PBKDF2 with a high work factor, or Argon2id.

    OWASP Top 10:2025 — A07 Identification and Authentication Failures
  patterns:
  - pattern-inside: |
      $MD = MessageDigest.getInstance($ALG);
      ...
  - pattern-either:
    - pattern: $MD.digest($PASSWORD, ...)
    - pattern: $MD.update($PASSWORD, ...)
  - metavariable-regex:
      metavariable: $ALG
      regex: (?i)^"(md5|sha-?1)"$
  - metavariable-regex:
      metavariable: $PASSWORD
      regex: (?i).*(passw|pwd|passphrase).*
  metadata:
    category: security
    owasp: A07:2025 Identification and Authentication Failures
    cwe: CWE-916
    confidence: HIGH
    pack:
    - web
    - fast
    - deep
    - bugbounty
- id: web-a07-weak-password-hash-ruby
  languages:
