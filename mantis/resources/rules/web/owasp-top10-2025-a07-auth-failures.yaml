  patterns:
  - pattern-either:
    - pattern: Digest::MD5.hexdigest($PASSWORD)
    - pattern: Digest::MD5.digest($PASSWORD)
    - pattern: Digest::SHA1.hexdigest($PASSWORD)
    - pattern: Digest::SHA1.digest($PASSWORD)
