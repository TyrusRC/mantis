- id: web-a07-hardcoded-credential-in-auth-python
  languages:
  - python
  severity: ERROR
  message: |
    Password or secret compared against a hardcoded string literal. Credentials
    must come from environment variables, a secrets manager, or a config file
    excluded from version control, and be compared in constant time.

    OWASP Top 10:2025 — A07 Identification and Authentication Failures
  patterns:
  - pattern-either:
    - pattern: $PASSWORD == "..."
    - pattern: '"..." == $PASSWORD'
  - pattern-not: $PASSWORD == ""
  - metavariable-regex:
      metavariable: $PASSWORD
      regex: (?i).*(passw|pwd|secret|api_?key|token).*
  metadata:
    category: security
    owasp: A07:2025 Identification and Authentication Failures
    cwe: CWE-798
    confidence: MEDIUM
    pack:
    - web
    - fast
    - deep
    - bugbounty
    - secrets
