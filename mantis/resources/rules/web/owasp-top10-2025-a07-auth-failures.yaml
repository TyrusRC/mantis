- id: web-a07-session-id-in-url-python
  languages:
  - python
  severity: ERROR
  message: |
    Session ID or token placed in a redirect URL query string. Tokens in URLs
    leak via Referer headers, browser history, and server logs. Use cookies
    with HttpOnly+Secure+SameSite or an Authorization header.

    OWASP Top 10:2025 — A07 Identification and Authentication Failures
  patterns:
  - pattern-either:
    - pattern: redirect($URL, ...)
    - pattern: HttpResponseRedirect($URL, ...)
    - pattern: RedirectResponse($URL, ...)
  - metavariable-regex:
      metavariable: $URL
      regex: (?i).*[?&;](session_?id|sessionid|jsessionid|sid|token|access_token)=.*
  metadata:
    category: security
    owasp: A07:2025 Identification and Authentication Failures
    cwe: CWE-598
    confidence: MEDIUM
    pack:
    - web
    - fast
    - deep
    - bugbounty
