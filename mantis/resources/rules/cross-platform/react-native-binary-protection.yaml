rules:
  # OWASP Mobile Top 10 - M7: Insufficient Binary Protections (React Native)
  # Detects missing obfuscation, debug artifacts, lack of root detection
  # Sources: React Native Security Best Practices 2024, OWASP Mobile Top 10
  # Coverage: JavaScript bundle protection, native code security, runtime protections

  # ============ JAVASCRIPT BUNDLE OBFUSCATION ============


  - id: react-native-m7-dev-mode-in-production
    patterns:
      - pattern-either:
          - pattern: |
              if (__DEV__) {
                ...
              }
          - pattern: |
              __DEV__ ? $TRUE : $FALSE
      - pattern-not-inside: |
          // Test
          describe('...', () => { ... })
      - pattern-not-inside: |
          // Development only
          if (__DEV__) {
            require('...').default.connectToDevTools()
          }
    message: |
      Production code contains __DEV__ checks (OWASP M7: Insufficient Binary Protections).
      __DEV__ flag should only control development-specific features, not security logic.
      In production builds, __DEV__ is false, but code paths should be properly removed.

      VULNERABLE PATTERNS:
      ```javascript
      // VULNERABLE: Debug bypass
      class ApiClient {
        async authenticate(credentials) {
          if (__DEV__) {
            return { token: 'debug-token' }; // Bypasses auth in debug!
          }
          return await this.realAuth(credentials);
        }
      }

      // VULNERABLE: Sensitive logging
      const loginUser = (username, password) => {
        if (__DEV__) {
          console.log(`Login: ${username} / ${password}`); // Leaks credentials
        }
      };

      // VULNERABLE: Security disabled
      const sslPinning = __DEV__ ? false : true;
      ```

      WHY PROBLEMATIC:
      - Debug builds may leak to production
      - __DEV__ code visible in bundle (even if not executed)
      - Provides attack insights
      - May expose sensitive data

      SECURE IMPLEMENTATION:
      ```javascript
      // config/environment.js
      const ENV = {
        development: {
          apiUrl: 'http://localhost:3000',
          enableLogging: true,
          enableMockData: true,
        },
        staging: {
          apiUrl: 'https://staging-api.example.com',
          enableLogging: true,
          enableMockData: false,
        },
        production: {
          apiUrl: 'https://api.example.com',
          enableLogging: false,
          enableMockData: false,
        },
      };

      const currentEnv = __DEV__ ? 'development' : 'production';

      export default ENV[currentEnv];

      // services/ApiClient.js
      import Config from '../config/environment';

      class ApiClient {
        constructor() {
          this.baseUrl = Config.apiUrl;
        }

        async authenticate(credentials) {
          // Never bypass authentication based on __DEV__
          const response = await fetch(`${this.baseUrl}/auth`, {
            method: 'POST',
            body: JSON.stringify(credentials),
          });

          if (!response.ok) {
            throw new Error('Authentication failed');
          }

          return response.json();
        }

        log(message) {
          // Safe logging (no sensitive data)
          if (Config.enableLogging) {
            console.log(`[API] ${message}`);
          }
        }
      }

      // utils/Logger.js
      class Logger {
        static debug(message) {
          if (__DEV__) {
            console.log(`[DEBUG] ${message}`);
          }
        }

        static info(message) {
          // Send to analytics in production, log in dev
          if (__DEV__) {
            console.log(`[INFO] ${message}`);
          } else {
            // Analytics.logEvent(message);
          }
        }

        // NEVER log sensitive data
        static secure(operation, metadata = {}) {
          const sanitized = {
            operation,
            timestamp: Date.now(),
            // Do NOT include credentials, tokens, PII
          };

          if (__DEV__) {
            console.log('[SECURE]', sanitized);
          }
          // Send to secure logging backend
        }
      }

      // Example: Proper use of __DEV__
      if (__DEV__) {
        // Development tools (removed in production via tree-shaking)
        const { connectToDevTools } = require('@react-devtools/core');
        connectToDevTools();
      }

      // Network inspector (dev only)
      if (__DEV__) {
        require('react-native-debugger-open').default();
      }
      ```

      METRO CONFIG (Remove __DEV__ code):
      ```javascript
      // metro.config.js
      module.exports = {
        transformer: {
          minifierConfig: {
            compress: {
              // Remove dead code (including false __DEV__ branches)
              dead_code: true,
              global_defs: {
                __DEV__: false, // Force to false in production
              },
            },
          },
        },
      };
      ```

      REACT NATIVE CONFIG:
      ```javascript
      // react-native.config.js
      module.exports = {
        transformer: {
          getTransformOptions: async () => ({
            transform: {
              experimentalImportSupport: false,
              inlineRequires: true,
            },
          }),
        },
      };
      ```

      BABEL CONFIGURATION:
      ```javascript
      // babel.config.js
      module.exports = {
        presets: ['module:metro-react-native-babel-preset'],
        plugins: [
          // Remove console.* in production
          [
            'transform-remove-console',
            {
              exclude: ['error', 'warn'],
            },
          ],
        ],
        env: {
          production: {
            plugins: [
              // Additional production optimizations
              'transform-react-remove-prop-types',
            ],
          },
        },
      };
      ```

      BUILD VERIFICATION:
      ```bash
      # Verify __DEV__ is false in bundle
      grep -n "__DEV__" android/app/src/main/assets/index.android.bundle

      # Should only see: __DEV__=!1 or similar (false)
      ```

      SAFE __DEV__ PATTERNS:
      ```javascript
      // ✅ GOOD: Dev tools only
      if (__DEV__) {
        require('react-devtools');
      }

      // ✅ GOOD: Performance monitoring
      if (__DEV__) {
        const whyDidYouRender = require('@welldone-software/why-did-you-render');
        whyDidYouRender(React);
      }

      // ✅ GOOD: Non-sensitive logging
      if (__DEV__) {
        console.log('App initialized');
      }

      // ❌ BAD: Security bypass
      if (__DEV__) {
        return mockAuth();
      }

      // ❌ BAD: Sensitive data
      if (__DEV__) {
        console.log('Token:', userToken);
      }
      ```

      Reference: React Native Performance, Metro Bundler Docs
    severity: WARNING
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-489: Active Debug Code"
      owasp-mobile-2024: "M7: Insufficient Binary Protections"
      confidence: HIGH
      false_positive_likelihood: MEDIUM

  # ============ ROOT DETECTION ============


  # ============ DEBUGGER DETECTION ============

  - id: react-native-m7-debugger-enabled
    patterns:
      - pattern: |
          debugger;
    message: |
      Debugger statement in production code (OWASP M7: Insufficient Binary Protections).
      debugger statements should be removed from production builds.

      SECURE IMPLEMENTATION:
      ```javascript
      // Use ESLint to prevent debugger statements
      // .eslintrc.js
      module.exports = {
        rules: {
          'no-debugger': 'error',
        },
      };

      // Remove debugger in build
      // babel.config.js
      module.exports = {
        plugins: [
          'transform-remove-console',
          'transform-remove-debugger',
        ],
      };
      ```

      Reference: ESLint Rules
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-489: Active Debug Code"
      owasp-mobile-2024: "M7: Insufficient Binary Protections"
      confidence: HIGH
      false_positive_likelihood: VERY_LOW

  # ============ CONSOLE LOGGING ============


  # ============ HERMES BYTECODE ============


  - id: react-native-m7-source-maps-in-bundle
    patterns:
      - pattern: |
          "build": "... --sourcemap-output=$PATH ..."
      - pattern-not: |
          "build": "... --sourcemap-output=/dev/null ..."
    message: |
      Source maps generated in production build (OWASP M7: Insufficient Binary Protections).
      Source maps should not be included in production bundles.

      SECURE CONFIGURATION:
      ```json
      {
        "scripts": {
          "bundle:android": "react-native bundle --sourcemap-output /dev/null",
          "bundle:ios": "react-native bundle --sourcemap-output /dev/null"
        }
      }
      ```

      Reference: React Native Bundle Configuration
    severity: WARNING
    languages:
      - json
    paths:
      include:
        - "**/package.json"
    metadata:
      category: security
      cwe: "CWE-538: Insertion of Sensitive Information into Externally-Accessible File or Directory"
      owasp-mobile-2024: "M7: Insufficient Binary Protections"
      confidence: MEDIUM
      false_positive_likelihood: LOW

  # ============ PROGUARD CONFIGURATION ============

  - id: react-native-m7-proguard-disabled-android
    patterns:
      - pattern-either:
          - pattern: |
              buildTypes {
                release {
                  ...
                  minifyEnabled false
                  ...
                }
              }
    message: |
      ProGuard/R8 disabled for React Native (OWASP M7).
      Native Android code should be obfuscated in release builds.

      SECURE CONFIGURATION:
      ```gradle
      // android/app/build.gradle
      android {
          buildTypes {
              release {
                  minifyEnabled true
                  shrinkResources true
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                                'proguard-rules.pro'
              }
          }
      }
      ```

      ```
      # android/app/proguard-rules.pro
      # Keep React Native
      -keep class com.facebook.react.** { *; }
      -keep class com.facebook.hermes.** { *; }

      # Obfuscate app code
      -repackageclasses ''
      -allowaccessmodification
      ```

      Reference: React Native Android Security
    severity: WARNING
    languages:
      - generic
    paths:
      include:
        - "**/*.gradle"
        - "**/*.gradle.kts"
    metadata:
      category: security
      cwe: "CWE-656: Reliance on Security Through Obscurity"
      owasp-mobile-2024: "M7: Insufficient Binary Protections"
      confidence: HIGH
      false_positive_likelihood: LOW

  # ============ INTEGRITY CHECKS ============

  - id: react-native-m7-missing-integrity-check
    patterns:
      - pattern: |
          export default function App() {
            ...
          }
      - pattern-not-inside: |
          Fingerprint.generate()
      - pattern-not-inside: |
          verifyAppIntegrity()
      - pattern-not-inside: |
          IntegrityChecker.verify()
    message: |
      Missing app integrity verification (OWASP M7: Insufficient Binary Protections).
      Apps should verify their own integrity to detect tampering.

      SECURE IMPLEMENTATION:
      ```javascript
      import Fingerprint from 'react-native-fingerprint-android';

      const verifyAppIntegrity = async () => {
        const fingerprint = await Fingerprint.generate();

        // Compare with expected signature
        const expectedSignature = 'YOUR_SIGNATURE_HASH';

        if (fingerprint !== expectedSignature) {
          throw new Error('App integrity check failed');
        }
      };

      export default function App() {
        useEffect(() => {
          if (!__DEV__) {
            verifyAppIntegrity();
          }
        }, []);

        return <NavigationContainer>...</NavigationContainer>;
      }
      ```

      Reference: OWASP Mobile Tampering Detection
    severity: INFO
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-693: Protection Mechanism Failure"
      owasp-mobile-2024: "M7: Insufficient Binary Protections"
      confidence: LOW
      false_positive_likelihood: HIGH

  # ============ SCREENSHOT PROTECTION ============

  - id: react-native-m7-screenshot-allowed
    patterns:
      - pattern: |
          export default function $SCREEN() {
            ...
          }
      - pattern-not-inside: |
          ScreenCapture.preventScreenCapture()
    message: |
      Screenshots allowed on sensitive screens (OWASP M7).
      Banking/payment screens should prevent screenshots.

      SECURE IMPLEMENTATION:
      ```javascript
      import ScreenCapture from 'react-native-screen-capture';

      const PaymentScreen = () => {
        useEffect(() => {
          ScreenCapture.preventScreenCapture();

          return () => {
            ScreenCapture.allowScreenCapture();
          };
        }, []);

        return <View>...</View>;
      };
      ```

      Reference: React Native Security
    severity: INFO
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp-mobile-2024: "M7: Insufficient Binary Protections"
      confidence: LOW
      false_positive_likelihood: HIGH
