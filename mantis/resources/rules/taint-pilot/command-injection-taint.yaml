rules:
- id: taint-python-command-injection-subprocess
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.args[...]
      - pattern: $REQ.args.get(...)
      - pattern: $REQ.form[...]
      - pattern: $REQ.form.get(...)
      - pattern: $REQ.json[...]
      - pattern: $REQ.GET[...]
      - pattern: $REQ.POST[...]
      - pattern: $REQ.cookies[...]
      - pattern: $REQ.headers[...]
      - pattern: request.args.get(...)
      - pattern: request.form[...]
      - pattern: request.json
      - pattern: input(...)
      - pattern: sys.argv[$X]
      - pattern: os.environ[$X]
      - pattern: os.environ.get(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern-either:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
      - pattern: os.system($CMD)
      - pattern: os.popen($CMD)
      - pattern: commands.getoutput($CMD)
      - pattern: commands.getstatusoutput($CMD)
      - pattern: asyncio.create_subprocess_shell($CMD, ...)
      - pattern: asyncio.subprocess.create_subprocess_shell($CMD, ...)
      - pattern: $LOOP.subprocess_shell($PROTO, $CMD, ...)
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: shlex.quote($X)
      - pattern: shlex.split($X)
  message: 'Tainted user input flows into a shell command. Use a list-form subprocess call

    with shell=False (the default) so each argument is passed as a separate token,

    or shlex.quote() the value before splicing into a shell string. Never pass

    user input as part of a shell=True command.

    '
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    cwe: 'CWE-78: OS Command Injection'
    owasp: A05:2025 Injection
    confidence: HIGH
    pack:
    - taint
    - web
    - fast
    - deep
    - bugbounty
    references:
    - https://cwe.mitre.org/data/definitions/78.html
- id: taint-js-command-injection-child-process-exec
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.body.$F
      - pattern: $REQ.query.$F
      - pattern: $REQ.params.$F
      - pattern: $REQ.headers.$F
      - pattern: $REQ.cookies.$F
      - pattern: req.body
      - pattern: req.query
      - pattern: req.params
      - pattern: process.argv[$N]
      - pattern: process.env.$F
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: child_process.exec($CMD, ...)
      - pattern: child_process.execSync($CMD, ...)
      - pattern: cp.exec($CMD, ...)
      - pattern: exec($CMD, ...)
      - pattern: execSync($CMD, ...)
      - pattern: require("child_process").exec($CMD, ...)
      - pattern: 'spawn($BIN, $X, { shell: true })'
      - pattern: 'spawnSync($BIN, $X, { shell: true })'
      - pattern: execa($CMD, ...)
      - pattern: execa.sync($CMD, ...)
      - pattern: execaCommand($CMD, ...)
      - pattern: shelljs.exec($CMD, ...)
      - pattern: shell.exec($CMD, ...)
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: shellQuote.quote($X)
      - pattern: shellEscape($X)
  message: 'Tainted user input flows into child_process.exec()/execSync() which spawns a shell.

    Use child_process.execFile()/spawn() with an args array and shell:false. If shell is

    required, validate the input strictly against an allowlist; do not rely on string

    escaping alone.

    '
  severity: ERROR
  languages:
  - javascript
  - typescript
  metadata:
    category: security
    cwe: 'CWE-78: OS Command Injection'
    owasp: A05:2025 Injection
    confidence: HIGH
    pack:
    - taint
    - web
    - fast
    - deep
    - bugbounty
    references:
    - https://cwe.mitre.org/data/definitions/78.html
    - https://nodejs.org/api/child_process.html
