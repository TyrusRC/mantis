rules:
- id: taint-python-sql-injection-cursor-execute
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.args[...]
      - pattern: $REQ.args.get(...)
      - pattern: $REQ.form[...]
      - pattern: $REQ.form.get(...)
      - pattern: $REQ.json[...]
      - pattern: $REQ.json.get(...)
      - pattern: $REQ.values[...]
      - pattern: $REQ.GET[...]
      - pattern: $REQ.POST[...]
      - pattern: $REQ.cookies[...]
      - pattern: $REQ.headers[...]
      - pattern: $REQ.params.get(...)
      - pattern: request.args[...]
      - pattern: request.args.get(...)
      - pattern: request.form[...]
      - pattern: request.json
      - pattern: request.values[...]
      - pattern: request.cookies[...]
      - pattern: request.headers[...]
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $CUR.execute($Q, ...)
      - pattern: $CUR.executemany($Q, ...)
      - pattern: $CUR.executescript($Q)
      - pattern: $ENG.execute($Q, ...)
      - pattern: $DB.execute($Q, ...)
      - pattern: $ENG.exec_driver_sql($Q, ...)
      - pattern: $MODEL.objects.raw($Q, ...)
      - pattern: $MODEL.objects.extra(...)
      - pattern: $QS.extra(...)
      - pattern: django.db.connection.cursor().execute($Q, ...)
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: int($X)
      - pattern: float($X)
      - pattern: bool($X)
      - pattern: $X.isdigit()
      - pattern: $X.isnumeric()
      - pattern: re.escape($X)
      - pattern: sqlalchemy.text(...).bindparams(...)
  message: 'Tainted user input flows into a SQL cursor.execute()-style call without parameterization.

    Use parameterized queries: pass values as the second argument tuple, e.g.

    cursor.execute("SELECT * FROM t WHERE id = ?", (uid,)). Never f-string or concatenate

    user input into the SQL string.

    '
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    cwe: 'CWE-89: SQL Injection'
    owasp: A05:2025 Injection
    confidence: HIGH
    pack:
    - taint
    - web
    - fast
    - deep
    - bugbounty
    references:
    - https://owasp.org/Top10/A03_2021-Injection/
    - https://cwe.mitre.org/data/definitions/89.html
- id: taint-js-sql-injection
  mode: taint
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: User-controlled input reaches a SQL query string. Use parameterized queries / prepared statements (pass values as bind parameters, e.g. db.query('SELECT ... WHERE id = ?', [id])) or an ORM query builder instead of concatenating request data into SQL.
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.body.$F
      - pattern: $REQ.body[...]
      - pattern: $REQ.query.$F
      - pattern: $REQ.query[...]
      - pattern: $REQ.params.$F
      - pattern: $REQ.params[...]
      - pattern: $REQ.headers.$F
      - pattern: $REQ.headers[...]
      - pattern: $REQ.cookies.$F
      - pattern: req.body
      - pattern: req.query
      - pattern: req.params
      - pattern: process.argv[$N]
      - pattern: process.env.$F
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $DB.query($Q, ...)
      - pattern: $CONN.query($Q, ...)
      - pattern: connection.query($Q, ...)
      - pattern: knex.raw($Q)
      - pattern: sequelize.query($Q, ...)
      - pattern: $POOL.query($Q, ...)
  pattern-sanitizers:
  - pattern-either:
    - pattern: mysql.escape($X)
    - pattern: $CONN.escape($X)
    - pattern: parseInt($X, ...)
    - pattern: Number($X)
  metadata:
    category: security
    cwe: 'CWE-89: SQL Injection'
    owasp: A05:2025 Injection
    confidence: HIGH
    pack:
    - taint
    - web
    - deep
    - bugbounty
    references:
    - https://cwe.mitre.org/data/definitions/89.html
