rules:
- id: taint-python-xxe-lxml
  mode: taint
  languages:
  - python
  severity: ERROR
  message: 'Potential XML external entity (XXE) injection (CWE-611): a user-controlled

    XML document is parsed by a parser that may resolve external entities,

    enabling file disclosure, SSRF, or denial of service. Remediation: use

    defusedxml for untrusted XML, or configure an lxml.etree.XMLParser with

    resolve_entities=False, no_network=True, and dtd_validation disabled, and

    pass it explicitly to parse()/fromstring().

    '
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.args[...]
      - pattern: $REQ.args.get(...)
      - pattern: $REQ.form[...]
      - pattern: $REQ.form.get(...)
      - pattern: $REQ.values[...]
      - pattern: $REQ.values.get(...)
      - pattern: $REQ.json[...]
      - pattern: $REQ.json.get(...)
      - pattern: $REQ.get_json(...)
      - pattern: $REQ.GET[...]
      - pattern: $REQ.GET.get(...)
      - pattern: $REQ.POST[...]
      - pattern: $REQ.POST.get(...)
      - pattern: $REQ.data
      - pattern: $REQ.body
      - pattern: $REQ.cookies[...]
      - pattern: $REQ.cookies.get(...)
      - pattern: $REQ.headers[...]
      - pattern: $REQ.headers.get(...)
      - pattern: request.args.get(...)
      - pattern: request.form[...]
      - pattern: request.values.get(...)
      - pattern: request.json
      - pattern: request.get_json(...)
      - pattern: input(...)
      - pattern: sys.argv[$N]
      - pattern: os.environ[$K]
      - pattern: os.environ.get(...)
      - pattern: flask.request.$ANY
      - pattern: fastapi.Query(...)
      - pattern: fastapi.Form(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: lxml.etree.fromstring($X, ...)
      - pattern: lxml.etree.parse($X, ...)
      - pattern: etree.fromstring($X)
      - pattern: xml.dom.minidom.parseString($X)
      - pattern: xml.sax.parseString($X, ...)
  metadata:
    category: security
    cwe: 'CWE-611: Improper Restriction of XML External Entity Reference'
    owasp: A05:2025 Injection
    confidence: HIGH
    pack:
    - taint
    - web
    - deep
    - bugbounty
    references:
    - https://cwe.mitre.org/data/definitions/611.html
